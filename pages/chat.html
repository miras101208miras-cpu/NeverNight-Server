<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeverChat — Анонимный чат EcosystemNever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Montserrat:wght@600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060a;
      --card: rgba(16, 23, 38, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f0ff;
      --purple: #a855f7;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 18px; overflow: hidden;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .topbar { width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .brand-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem; }
    .brand-title span { color: var(--cyan); }
    .back-btn {
      padding: 9px 18px; border-radius: 20px; text-decoration: none;
      color: var(--cyan); border: 1px solid rgba(0, 240, 255, 0.35);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; transition: all 0.3s;
      font-family: 'JetBrains Mono', monospace;
    }
    .back-btn:hover { background: rgba(0, 240, 255, 0.12); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

    .chat-wrap {
      width: 100%; max-width: 900px; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: rgba(9, 13, 22, 0.9); border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(0, 240, 255, 0.1);
    }
    .chat-head {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      background: rgba(4, 8, 15, 0.9);
    }
    .room-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--cyan);
      background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 12px; border-radius: 12px;
    }
    .online-chip { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #10b981; }
    .online-chip b { color: #fff; }

    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.25); border-radius: 4px; }
    .msg { max-width: 78%; }
    .msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .msg-nick { font-size: 0.75rem; font-weight: 800; }
    .msg-time { font-size: 0.62rem; color: #64748b; font-family: 'JetBrains Mono', monospace; }
    .msg-bubble {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
      padding: 9px 13px; border-radius: 12px; font-size: 0.88rem; line-height: 1.45;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg.mine { align-self: flex-end; }
    .msg.mine .msg-head { justify-content: flex-end; }
    .msg.mine .msg-bubble { background: rgba(0, 240, 255, 0.08); border-color: rgba(0, 240, 255, 0.25); }
    .system-msg {
      text-align: center; font-size: 0.7rem; color: #64748b;
      font-family: 'JetBrains Mono', monospace; padding: 4px 0;
    }
    .typing-line { height: 18px; font-size: 0.68rem; color: var(--purple); padding: 0 18px; font-family: 'JetBrains Mono', monospace; }

    .input-bar {
      display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border);
      background: rgba(4, 8, 15, 0.9);
    }
    .chat-input {
      flex: 1; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: #fff; outline: none;
      font-family: 'Montserrat', sans-serif; font-size: 0.9rem; transition: border 0.3s;
    }
    .chat-input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.25); }
    .send-btn {
      padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #04060a; font-weight: 800; font-family: 'Montserrat', sans-serif; font-size: 0.9rem;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.4); transition: all 0.3s;
    }
    .send-btn:hover { box-shadow: 0 0 30px rgba(0, 240, 255, 0.7); transform: translateY(-1px); }

    /* Модалка входа */
    .overlay {
      position: fixed; inset: 0; background: rgba(4, 6, 10, 0.92); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .overlay.hidden { display: none; }
    .join-box {
      width: 100%; max-width: 400px; text-align: center;
      background: var(--card); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 20px;
      padding: 34px 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .join-box h1 { font-family: 'Syne', sans-serif; font-size: 1.7rem; margin-bottom: 6px; }
    .join-box h1 span { background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .join-box p { color: var(--muted); font-size: 0.82rem; margin-bottom: 22px; }
    .join-input {
      width: 100%; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: #fff; outline: none;
      font-family: 'Montserrat', sans-serif; font-size: 0.92rem; margin-bottom: 14px; transition: border 0.3s;
    }
    .join-input:focus { border-color: var(--cyan); }
    .join-btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #04060a; font-weight: 800; font-size: 0.95rem; font-family: 'Montserrat', sans-serif;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45); transition: all 0.3s;
    }
    .join-btn:hover { box-shadow: 0 0 35px rgba(0, 240, 255, 0.8); }
    .color-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
    .color-dot {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
    }
    .color-dot.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 12px currentColor; }
    .room-hint { font-size: 0.68rem; color: #64748b; margin-top: 14px; font-family: 'JetBrains Mono', monospace; }
    .room-hint b { color: var(--cyan); }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="topbar">
    <a href="/" class="brand">
      <div class="brand-logo">💬</div>
      <div class="brand-title">Never<span>Chat</span></div>
    </a>
    <a href="/" class="back-btn">← ПОРТФОЛИО</a>
  </div>

  <div class="chat-wrap">
    <div class="chat-head">
      <div class="room-chip" id="roomChip">⌂ Комната: main</div>
      <div class="online-chip">онлайн: <b id="onlineCount">1</b></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-line" id="typingLine"></div>
    <div class="input-bar">
      <input class="chat-input" id="msgInput" placeholder="Напиши сообщение..." maxlength="500" disabled>
      <button class="send-btn" id="sendBtn" disabled>➤</button>
    </div>
  </div>

  <div class="overlay" id="joinOverlay">
    <div class="join-box">
      <h1>Never<span>Chat</span></h1>
      <p>Анонимный чат экосистемы. Без регистрации — просто nickname.</p>
      <div class="color-row" id="colorRow"></div>
      <input class="join-input" id="nickInput" placeholder="Твой ник (до 20 символов)" maxlength="20">
      <input class="join-input" id="roomInput" placeholder="Комната (по умолчанию: main)" maxlength="24">
      <button class="join-btn" id="joinBtn">⚡ Войти в чат</button>
      <div class="room-hint">Комната по ссылке: <b>/chat?room=название</b> — отправь её другу</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const COLORS = ['#00f0ff', '#a855f7', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#3b82f6'];
    let myNick = '', myColor = COLORS[0];
    let typingTimer = null, lastTypingSent = 0;

    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingLine = document.getElementById('typingLine');

    // Выбор цвета
    const colorRow = document.getElementById('colorRow');
    COLORS.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'color-dot' + (i === 0 ? ' active' : '');
      d.style.background = c;
      d.style.color = c;
      d.onclick = () => {
        colorRow.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active'));
        d.classList.add('active');
        myColor = c;
      };
      colorRow.appendChild(d);
    });

    // Комната из URL
    const urlRoom = new URLSearchParams(location.search).get('room');
    if (urlRoom) document.getElementById('roomInput').value = urlRoom;
    document.getElementById('nickInput').focus();

    const socket = io();

    function timeStr(ts) {
      return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function addMsg({ nick, color, text, ts }) {
      const mine = nick === myNick;
      const msg = document.createElement('div');
      msg.className = 'msg' + (mine ? ' mine' : '');

      const head = document.createElement('div');
      head.className = 'msg-head';
      const nickEl = document.createElement('span');
      nickEl.className = 'msg-nick';
      nickEl.textContent = nick;
      nickEl.style.color = color;
      const timeEl = document.createElement('span');
      timeEl.className = 'msg-time';
      timeEl.textContent = timeStr(ts);
      head.append(nickEl, timeEl);

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text; // textContent = безопасно от XSS

      msg.append(head, bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystem(text) {
      const el = document.createElement('div');
      el.className = 'system-msg';
      el.textContent = '— ' + text + ' —';
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    socket.on('history', (rows) => {
      messagesEl.innerHTML = '';
      rows.forEach(addMsg);
    });
    socket.on('msg', addMsg);
    socket.on('system', (d) => addSystem(d.text));
    socket.on('online', (list) => {
      document.getElementById('onlineCount').textContent = list.length;
    });
    socket.on('typing', ({ nick, typing }) => {
      if (nick === myNick) return;
      typingLine.textContent = typing ? nick + ' печатает...' : '';
      clearTimeout(typingTimer);
      if (typing) typingTimer = setTimeout(() => typingLine.textContent = '', 2500);
    });

    function send() {
      const text = input.value.trim();
      if (!text) return;
      socket.emit('msg', text);
      socket.emit('typing', false);
      input.value = '';
      input.focus();
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    input.addEventListener('input', () => {
      const now = Date.now();
      if (now - lastTypingSent > 1500) {
        socket.emit('typing', true);
        lastTypingSent = now;
      }
    });

    document.getElementById('joinBtn').onclick = join;
    document.getElementById('nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
    document.getElementById('roomInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

    function join() {
      const nick = document.getElementById('nickInput').value.trim() || 'Гость';
      const room = document.getElementById('roomInput').value.trim() || 'main';
      myNick = nick;
      socket.emit('join', { nick, color: myColor, room });
      document.getElementById('roomChip').textContent = '⌂ Комната: ' + room;
      document.getElementById('joinOverlay').classList.add('hidden');
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  </script>
  <script src="/app.js" defer></script>
</body>
</html>
