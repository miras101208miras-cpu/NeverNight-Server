<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeverWall — Стен идей EcosystemNever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Montserrat:wght@600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060a;
      --card: rgba(16, 23, 38, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f0ff;
      --purple: #a855f7;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh; padding: 24px;
      display: flex; flex-direction: column; align-items: center;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .glow {
      position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
      width: 70vw; height: 50vh; z-index: -1; pointer-events: none;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.14), rgba(236, 72, 153, 0.08), transparent 70%);
      filter: blur(90px);
    }
    .topbar { width: 100%; max-width: 760px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
    }
    .brand-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem; }
    .brand-title span { color: var(--purple); }
    .back-btn {
      padding: 9px 18px; border-radius: 20px; text-decoration: none;
      color: var(--cyan); border: 1px solid rgba(0, 240, 255, 0.35);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; transition: all 0.3s;
      font-family: 'JetBrains Mono', monospace;
    }
    .back-btn:hover { background: rgba(0, 240, 255, 0.12); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

    .wrap { width: 100%; max-width: 760px; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--purple); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
    h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 5.5vw, 3rem); font-weight: 800; margin-bottom: 10px; }
    h1 span { background: linear-gradient(135deg, var(--purple), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { color: var(--muted); margin-bottom: 30px; font-size: 0.95rem; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 24px; backdrop-filter: blur(16px); margin-bottom: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .w-input {
      flex: 1; min-width: 180px;
      background: rgba(0, 0, 0, 0.45); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: #fff; outline: none;
      font-family: 'Montserrat', sans-serif; font-size: 0.9rem; transition: border 0.3s;
    }
    .w-input:focus { border-color: var(--purple); box-shadow: 0 0 12px rgba(168, 85, 247, 0.25); }
    .w-btn {
      padding: 13px 26px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--purple), #ec4899);
      color: #fff; font-weight: 800; font-size: 0.9rem; font-family: 'Montserrat', sans-serif;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.4); transition: all 0.3s;
    }
    .w-btn:hover { box-shadow: 0 0 32px rgba(168, 85, 247, 0.75); transform: translateY(-1px); }
    .w-err { color: #ff5f56; font-size: 0.75rem; min-height: 16px; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

    .ideas { display: flex; flex-direction: column; gap: 12px; }
    .idea {
      display: flex; gap: 16px; align-items: flex-start;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 18px; transition: border 0.3s;
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .idea:hover { border-color: rgba(168, 85, 247, 0.35); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .vote-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: rgba(168, 85, 247, 0.08); border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px; padding: 10px 14px; cursor: pointer; color: var(--purple);
      font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 0.95rem;
      transition: all 0.25s; min-width: 56px;
    }
    .vote-btn:hover { background: rgba(168, 85, 247, 0.2); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
    .vote-btn.voted { background: rgba(168, 85, 247, 0.3); border-color: var(--purple); box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
    .vote-arrow { font-size: 0.7rem; }
    .idea-body { flex: 1; min-width: 0; }
    .idea-text { font-size: 0.92rem; line-height: 1.5; margin-bottom: 6px; word-break: break-word; }
    .idea-meta { font-size: 0.65rem; color: #64748b; font-family: 'JetBrains Mono', monospace; }
    .rank { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: #475569; }
    .empty { text-align: center; color: #64748b; padding: 30px; font-size: 0.85rem; }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="glow"></div>

  <div class="topbar">
    <a href="/" class="brand">
      <div class="brand-logo">📝</div>
      <div class="brand-title">Never<span>Wall</span></div>
    </a>
    <a href="/" class="back-btn">← ПОРТФОЛИО</a>
  </div>

  <div class="wrap">
    <div class="tag">// Онлайн-сервис EcosystemNever</div>
    <h1>Стена <span>идей Never</span></h1>
    <p class="sub">Предложи фичу для экосистемы и поставь 👍. Самые залайканные идеи войдут в roadmap!</p>

    <div class="card">
      <div class="row">
        <input class="w-input" id="authorInput" placeholder="Твой ник (необязательно)" maxlength="20">
      </div>
      <div class="row" style="margin-top: 10px;">
        <input class="w-input" id="ideaInput" placeholder="Моя идея: например, NeverMusic — плеер с визуализацией..." maxlength="200">
        <button class="w-btn" id="addBtn">💡 Добавить идею</button>
      </div>
      <div class="w-err" id="err"></div>
    </div>

    <div class="ideas" id="ideas">
      <div class="empty">Загрузка идей...</div>
    </div>
  </div>

<script>
  const ideasEl = document.getElementById('ideas');
  const ideaInput = document.getElementById('ideaInput');
  const authorInput = document.getElementById('authorInput');
  const addBtn = document.getElementById('addBtn');
  const errEl = document.getElementById('err');

  // Голоса храним по IP на сервере, а "своя ли идея для подсветки" — локально
  const myVotes = new Set(JSON.parse(localStorage.getItem('neverwall_votes') || '[]'));
  const saveVotes = () => localStorage.setItem('neverwall_votes', JSON.stringify([...myVotes]));

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'только что';
    if (s < 3600) return Math.floor(s / 60) + ' мин назад';
    if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
    return new Date(ts).toLocaleDateString('ru-RU');
  }

  function renderIdea(e) {
    const div = document.createElement('div');
    div.className = 'idea';
    div.dataset.id = e.id;

    const btn = document.createElement('button');
    btn.className = 'vote-btn' + (myVotes.has(e.id) ? ' voted' : '');
    btn.innerHTML = '<span class="vote-arrow">▲</span><span class="vote-count">' + e.votes + '</span>';
    btn.onclick = () => vote(e.id, btn);

    const body = document.createElement('div');
    body.className = 'idea-body';
    const text = document.createElement('div');
    text.className = 'idea-text';
    text.textContent = e.text;
    const meta = document.createElement('div');
    meta.className = 'idea-meta';
    meta.textContent = '— ' + e.author + ' · ' + timeAgo(e.ts);
    body.append(text, meta);

    div.append(btn, body);
    return div;
  }

  async function load() {
    try {
      const r = await fetch('/api/wall');
      const rows = await r.json();
      ideasEl.innerHTML = '';
      if (!rows.length) {
        ideasEl.innerHTML = '<div class="empty">Идей пока нет — предложи первую! 💡</div>';
        return;
      }
      rows.forEach((e) => ideasEl.appendChild(renderIdea(e)));
    } catch {
      ideasEl.innerHTML = '<div class="empty">⚠ Сервер офлайн — запусти npm start в папке server.</div>';
    }
  }

  async function vote(id, btn) {
    try {
      const r = await fetch('/api/wall/' + id + '/vote', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { errEl.textContent = '⚠ ' + (data.error || 'Ошибка.'); return; }
      btn.querySelector('.vote-count').textContent = data.votes;
      btn.classList.toggle('voted', data.voted);
      if (data.voted) myVotes.add(id); else myVotes.delete(id);
      saveVotes();
      // Пересортировка после голоса
      const cards = [...ideasEl.children];
      cards.sort((a, b) => {
        const va = Number(a.querySelector('.vote-count').textContent);
        const vb = Number(b.querySelector('.vote-count').textContent);
        return vb - va;
      });
      cards.forEach((c) => ideasEl.appendChild(c));
    } catch {
      errEl.textContent = '⚠ Сервер недоступен.';
    }
  }

  addBtn.onclick = async () => {
    errEl.textContent = '';
    const text = ideaInput.value.trim();
    const author = authorInput.value.trim() || 'Гость';
    if (!text) { errEl.textContent = '⚠ Напиши идею.'; return; }
    addBtn.disabled = true;
    try {
      const r = await fetch('/api/wall', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, author })
      });
      const data = await r.json();
      if (!r.ok) { errEl.textContent = '⚠ ' + (data.error || 'Ошибка сервера.'); addBtn.disabled = false; return; }
      ideaInput.value = '';
      ideasEl.prepend(renderIdea(data));
      if (ideasEl.querySelector('.empty')) ideasEl.innerHTML = '';
    } catch {
      errEl.textContent = '⚠ Сервер недоступен.';
    }
    addBtn.disabled = false;
  };
  ideaInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addBtn.onclick(); });

  load();
</script>
  <script src="/app.js" defer></script>
</body>
</html>
